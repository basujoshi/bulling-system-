<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.D. Bajar Stock Management</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding:10px;
}

.stock-box{
max-width:1100px;
margin:auto;
background:#fff;
padding:15px;
border:2px solid #000;
border-radius:10px;
}

h2{
text-align:center;
margin-bottom:15px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

input{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
margin-top:5px;
font-size:14px;
}

button{
padding:12px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:14px;
color:#fff;
}

.save-btn{
background:#000;
width:100%;
margin-top:10px;
}

.lock-btn{
background:#000;
width:100%;
margin-top:10px;
}

.upload-btn{
background:#28a745;
width:100%;
margin-top:10px;
}

.search-box{
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#000;
color:#fff;
padding:10px;
font-size:13px;
}

td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:13px;
}

.edit-btn{
background:orange;
padding:6px 10px;
border:none;
color:#fff;
cursor:pointer;
border-radius:4px;
}

.delete-btn{
background:red;
padding:6px 10px;
border:none;
color:#fff;
cursor:pointer;
margin-left:5px;
border-radius:4px;
}

.delete-hide{
display:none;
}

.low-stock{
background:#ffe0e0;
}

.stock-ok{
color:green;
font-weight:bold;
}

.stock-low{
color:red;
font-weight:bold;
}

.file-input-wrapper{
margin-top:10px;
}

.file-input-wrapper input{
margin-top:10px;
}

@media(max-width:700px){

.form-grid{
grid-template-columns:1fr;
}

table{
font-size:11px;
}

th,td{
padding:5px;
}

}

@media print{

button,
.search-box,
.file-input-wrapper{
display:none;
}

body{
background:#fff;
}

.stock-box{
border:none;
}

}

</style>

<body>

<div class="stock-box">

<h2>
📦 B.D. Bajar Stock Management 
</h2>

<div class="form-grid">

<div>
Item Name
<input
type="text"
id="itemName"
placeholder="Item Name"
>
</div>

<div>
Brand
<input
type="text"
id="brand"
placeholder="Brand Name"
>
</div>

<div>
Item Code
<input
type="text"
id="itemCode"
placeholder="Item Code"
>
</div>

<div>
Size
<input
type="text"
id="size"
placeholder="Size"
>
</div>

<div>
Price
<input
type="number"
id="price"
placeholder="Price"
>
</div>

<div>
Stock Qty
<input
type="number"
id="qty"
placeholder="Qty"
>
</div>

</div>

<!-- SAVE -->

<button
class="save-btn"
onclick="saveStock()"
>

💾 SAVE STOCK

</button>

<!-- LOCK -->

<button
id="lockBtn"
class="lock-btn"
onclick="toggleDeleteMode()"
>

🔒 DELETE LOCK

</button>

<!-- FILE UPLOAD -->

<div class="file-input-wrapper">

<input
type="file"
id="stockFile"
accept=".csv,.xlsx,.xls"
style="display:none;"
onchange="handleFileUpload(this)"
>

<button
class="upload-btn"
onclick="document.getElementById('stockFile').click()"
>

📁 UPLOAD EXCEL/CSV FILE

</button>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchStock"
placeholder="🔎 Search Item / Brand / Code"
onkeyup="loadStock()"
>

</div>

<!-- TABLE -->

<table>

<thead>

<tr>

<th>SN</th>
<th>ITEM</th>
<th>BRAND</th>
<th>CODE</th>
<th>SIZE</th>
<th>PRICE</th>
<th>QTY</th>
<th>STATUS</th>
<th>ACTION</th>

</tr>

</thead>

<tbody id="stockBody"></tbody>

</table>

</div>

<!-- FIREBASE -->

<!-- SheetJS for Excel/CSV parsing -->
<script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>

<script>

const db = scopedDatabase();

let editKey = null;

/* DELETE LOCK */

let deleteUnlocked = false;

/* SAVE STOCK */

function saveStock(){

const itemName =
document.getElementById("itemName").value;

const brand =
document.getElementById("brand").value;

const itemCode =
document.getElementById("itemCode").value;

const size =
document.getElementById("size").value;

const price =
document.getElementById("price").value;

const qty =
document.getElementById("qty").value;

/* CHECK */

if(
itemName === "" ||
brand === "" ||
itemCode === "" ||
size === "" ||
price === "" ||
qty === ""
){

alert("Fill All Fields");

return;

}

const data = {

itemName,
brand,
itemCode,
size,
price,
qty

};

/* UPDATE */

if(editKey){

db.ref("stocks/" + editKey)
.update(data)
.then(()=>{

alert("✅ Stock Updated");

clearForm();

loadStock();

});

}else{

/* SAVE */

db.ref("stocks/" + Date.now())
.set(data)
.then(()=>{

alert("✅ Stock Saved");

clearForm();

loadStock();

});

}

}

/* FILE UPLOAD HANDLE */

function handleFileUpload(input){

const file = input.files[0];

if(!file){

return;

}

const reader = new FileReader();

reader.onload = function(e){

const data = new Uint8Array(e.target.result);

const workbook = XLSX.read(data, {type: 'array'});

const firstSheet = workbook.Sheets[workbook.SheetNames[0]];

const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

/* Skip header row if exists */
let startIndex = 0;

if(jsonData.length > 0){

const header = jsonData[0].map(h => String(h).toLowerCase());

if(header.includes('item name') || header.includes('item') || header.includes('name')){

startIndex = 1;

}

}

let successCount = 0;
let updateCount = 0;

/* Process each row */
for(let i = startIndex; i < jsonData.length; i++){

const row = jsonData[i];

if(!row || row.length === 0) continue;

/* Map columns - adjust indices based on your Excel column order */
const itemName = row[0] || "";
const brand = row[1] || "";
const itemCode = row[2] || "";
const size = row[3] || "";
const price = row[4] || "";
const qty = row[5] || "";

if(itemName && itemCode && price && qty){

const stockData = {

itemName: String(itemName).trim(),
brand: String(brand).trim(),
itemCode: String(itemCode).trim(),
size: String(size).trim(),
price: parseFloat(price) || 0,
qty: parseFloat(qty) || 0

};

/* Check if item code exists */
db.ref("stocks")
.once("value")
.then(snapshot => {

let foundKey = null;

snapshot.forEach(child => {

const d = child.val();

if(d.itemCode === stockData.itemCode){

foundKey = child.key;

}

});

if(foundKey){

/* Update existing */
db.ref("stocks/" + foundKey)
.update(stockData)
.then(()=>{

updateCount++;

if(updateCount + successCount === getTotalProcessed(snapshot)){

alert(`✅ File Upload Complete!
Added: ${successCount}
Updated: ${updateCount}`);

loadStock();

}

});

}else{

/* Add new */
db.ref("stocks/" + Date.now())
.set(stockData)
.then(()=>{

successCount++;

if(updateCount + successCount === getTotalProcessed(snapshot)){

alert(`✅ File Upload Complete!
Added: ${successCount}
Updated: ${updateCount}`);

loadStock();

}

});

}

});

}

}

};

reader.readAsArrayBuffer(file);

/* Helper to count total processed */
function getTotalProcessed(snapshot){

let count = 0;

for(let i = startIndex; i < jsonData.length; i++){

const row = jsonData[i];

if(row && row.length > 0 && row[0] && row[2] && row[4] && row[5]){

count++;

}

}

return count;

}

/* Clear file input */
input.value = "";

}

/* LOAD STOCK */

function loadStock(){

const body =
document.getElementById("stockBody");

const search =
document.getElementById("searchStock")
.value.toLowerCase();

body.innerHTML = "";

db.ref("stocks")
.once("value")
.then(snapshot=>{

let sn = 1;

snapshot.forEach(child=>{

const data = child.val();

if(

data.itemName.toLowerCase()
.includes(search)

||

data.brand.toLowerCase()
.includes(search)

||

data.itemCode.toLowerCase()
.includes(search)

){

const stockQty =
parseFloat(data.qty);

let stockStatus = "";

if(stockQty <= 0){

stockStatus =
'<span class="stock-low">NO STOCK</span>';

}
else if(stockQty <= 5){

stockStatus =
'<span class="stock-low">LOW STOCK</span>';

}
else{

stockStatus =
'<span class="stock-ok">AVAILABLE</span>';

}

body.innerHTML += `

<tr class="${stockQty <= 5 ? 'low-stock' : ''}">

<td>${sn++}</td>

<td>${data.itemName}</td>

<td>${data.brand}</td>

<td>${data.itemCode}</td>

<td>${data.size}</td>

<td>₹${data.price}</td>

<td>${data.qty}</td>

<td>${stockStatus}</td>

<td>

<button
class="edit-btn"

onclick="editStock(
'${child.key}',
'${data.itemName}',
'${data.brand}',
'${data.itemCode}',
'${data.size}',
'${data.price}',
'${data.qty}'
)"

>

EDIT

</button>

<button
class="delete-btn ${deleteUnlocked ? '' : 'delete-hide'}"

onclick="deleteStock(
'${child.key}'
)"

>

DELETE

</button>

</td>

</tr>

`;

}

});

});

}

/* EDIT */

function editStock(
key,
item,
brand,
code,
size,
price,
qty
){

editKey = key;

document.getElementById("itemName")
.value = item;

document.getElementById("brand")
.value = brand;

document.getElementById("itemCode")
.value = code;

document.getElementById("size")
.value = size;

document.getElementById("price")
.value = price;

document.getElementById("qty")
.value = qty;

window.scrollTo(0,0);

}

/* DELETE */

function deleteStock(key){

if(confirm("Delete This Stock ?")){

db.ref("stocks/" + key)
.remove()
.then(()=>{

alert("✅ Stock Deleted");

loadStock();

});

}

}

/* LOCK UNLOCK */

function toggleDeleteMode(){

deleteUnlocked = !deleteUnlocked;

const btn =
document.getElementById("lockBtn");

if(deleteUnlocked){

btn.innerHTML =
"🔓 DELETE UNLOCK";

btn.style.background =
"red";

}
else{

btn.innerHTML =
"🔒 DELETE LOCK";

btn.style.background =
"#000";

}

loadStock();

}

/* CLEAR */

function clearForm(){

editKey = null;

document.getElementById("itemName")
.value = "";

document.getElementById("brand")
.value = "";

document.getElementById("itemCode")
.value = "";

document.getElementById("size")
.value = "";

document.getElementById("price")
.value = "";

document.getElementById("qty")
.value = "";

}

/* AUTO LOAD */

loadStock();

</script>

</body>
