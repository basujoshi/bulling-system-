<style>

.page{max-width:1200px;margin:auto;background:#fff;padding:15px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.15)}
.hidden-print{display:block}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:bold;margin:5px 0}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}

.btn{background:#000;color:#fff}
.table-wrap{overflow:auto;margin-top:15px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #000;padding:8px;font-size:16px;text-align:center;font-weight:bold}
th{background:#000;color:#fff}
.card{margin-top:15px;border:1px solid #000;padding:10px;border-radius:6px}
.row{display:flex;justify-content:space-between;margin:6px 0;font-weight:bold}
.bill-print{max-width:80mm;margin:20px auto 0;background:#fff;padding:8px;border:2px solid #000}
.center{text-align:center}

.hidden-print{display:none!important}
body{background:#fff;padding:0}
.page{box-shadow:none;border:none;padding:0}
.bill-print{max-width:80mm;margin:0 auto;border:none;padding:6px}
}

<body>
<div class="page">
  <div class="hidden-print top">
    <div>
      <label>Search by Phone Number</label>
      <input type="text" id="phoneSearch" placeholder="Enter customer phone" oninput="searchBills()">
    </div>
    <div>
      <label>Search by Bill No</label>
      <input type="text" id="billSearch" placeholder="Enter bill number" oninput="searchBills()">
    </div>
  </div>

  <div class="hidden-print" style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn" onclick="searchBills()">Search</button>
    <button onclick="printSelected()">Print Selected Bill</button>
  </div>

  <div class="card hidden-print">
    <div class="row"><span>Matching Bills</span><span id="count">0</span></div>
  </div>

  <div class="table-wrap hidden-print">
    <table>
      <thead>
        <tr>
          <th>Bill No</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Total</th>
          <th>Paid</th>
          <th>Balance</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>

  <div id="printArea"></div>
</div>

<script>
const db = scopedDatabase();

let selectedBill = null;
let selectedBillNo = "";

function searchBills(){
  const phone = document.getElementById("phoneSearch").value.trim();
  const billNo = document.getElementById("billSearch").value.trim().toUpperCase();
  const body = document.getElementById("resultBody");
  body.innerHTML = "";
  selectedBill = null;
  selectedBillNo = "";

  db.ref("bills").once("value").then(snapshot=>{
    const rows = [];
    snapshot.forEach(child=>{
      const b = child.val() || {};
      const p = String(b.customerPhone || "");
      const bn = String(b.billNo || child.key || "").toUpperCase();

      const phoneOk = !phone || p.includes(phone);
      const billOk = !billNo || bn.includes(billNo);

      if(phoneOk && billOk){
        rows.push({key: child.key, data: b});
      }
    });

    document.getElementById("count").innerText = rows.length;

    rows.forEach((r, idx)=>{
      const b = r.data;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${b.billNo || r.key}</td>
        <td>${b.date || ""}</td>
        <td>${b.customerName || ""}</td>
        <td>${b.customerPhone || ""}</td>
        <td>${parseFloat(b.total || 0).toFixed(2)}</td>
        <td>${parseFloat(b.paidAmount || 0).toFixed(2)}</td>
        <td>${parseFloat(b.balanceAmount || 0).toFixed(2)}</td>
        <td>
          <button class="btn" onclick='viewBill(${JSON.stringify(b)})'>View</button>
          <button class="btn" style="margin-left:5px" onclick='printBill(${JSON.stringify(b)})'>Print</button>
        </td>
      `;
      body.appendChild(tr);

      if(idx === 0){
        selectedBill = b;
        selectedBillNo = b.billNo || r.key;
      }
    });

    if(rows.length > 0){
      viewBill(rows[0].data);
    }else{
      document.getElementById("printArea").innerHTML = "";
    }
  });
}

function viewBill(bill){
  selectedBill = bill;
  selectedBillNo = bill.billNo || "";
  document.getElementById("printArea").innerHTML = billHtml(bill);
  setTimeout(()=>{
    try{
      JsBarcode("#billBarcode", bill.billNo || "", {
        format:"CODE128",
        lineColor:"#000",
        width:1.5,
        height:35,
        displayValue:true,
        fontSize:11
      });
    }catch(e){}
  }, 50);
}

function printSelected(){
  if(!selectedBill){ alert("Please select a bill first"); return; }
  printBill(selectedBill);
}

function printBill(bill){
  selectedBill = bill;
  selectedBillNo = bill.billNo || "";
  document.getElementById("printArea").innerHTML = billHtml(bill);
  setTimeout(()=>{
    try{
      JsBarcode("#billBarcode", bill.billNo || "", {
        format:"CODE128",
        lineColor:"#000",
        width:1.5,
        height:35,
        displayValue:true,
        fontSize:11
      });
    }catch(e){}
    window.print();
  }, 150);
}

function billHtml(b){
  const items = (b.items || []).map((i, idx)=>`
    <tr>
      <td>${idx+1}</td>
      <td style="text-align:left">${i.name || ""}</td>
      <td>${i.qty || 0}</td>
      <td>${parseFloat(i.price || 0).toFixed(2)}</td>
      <td>${parseFloat(i.amount || 0).toFixed(2)}</td>
    </tr>
  `).join("");

  return `
  <div class="bill-print" id="billPrint">
    <div class="center">
      <img src="https://i.ibb.co/wFzsH2HH/file-000000004ff8720a84a2883a63ef6b6e.png" style="width:180px;max-width:100%">
      <div class="small" style="margin-top:4px">B.D.Bajar</div>
      <svg id="billBarcode"></svg>
    </div>
    <hr>
    <div class="small">
      Bill No: ${b.billNo || ""}<br>
      Date: ${b.date || ""}<br>
      Customer: ${b.customerName || ""}<br>
      Phone: ${b.customerPhone || ""}<br>
      Payment: ${b.paymentMode || ""}
    </div>
    <hr>
    <table class="print-table">
      <thead>
        <tr>
          <th>SN</th>
          <th>Item</th>
          <th>Qty</th>
          <th>Rate</th>
          <th>Amt</th>
        </tr>
      </thead>
      <tbody>
        ${items}
      </tbody>
    </table>
    <hr>
    <div class="print-total"><span>Sub Total</span><span>${parseFloat(b.subtotal || 0).toFixed(2)}</span></div>
    <div class="print-total"><span>Discount</span><span>${parseFloat(b.discountAmount || 0).toFixed(2)}</span></div>
    <div class="print-total"><span>Return Credit</span><span>${parseFloat(b.returnDeduction || 0).toFixed(2)}</span></div>
    <div class="print-total" style="font-size:14px"><span>Total</span><span>${parseFloat(b.total || 0).toFixed(2)}</span></div>
    <div class="print-total"><span>Paid</span><span>${parseFloat(b.paidAmount || 0).toFixed(2)}</span></div>
    <div class="print-total"><span>Balance</span><span>${parseFloat(b.balanceAmount || 0).toFixed(2)}</span></div>
    <hr>
    <div class="small center">THANK YOU FOR PURCHASE</div>
  </div>`;
}
</script>
</body>
