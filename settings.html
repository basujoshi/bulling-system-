<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Settings • Multi User Billing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#07111f,#101b33);color:#fff;min-height:100vh;padding:20px}.box{width:min(650px,100%);margin:30px auto;background:#111d31;border:1px solid #263a5b;border-radius:20px;padding:25px;box-shadow:0 20px 60px #0007}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.back{color:#7dd3fc;text-decoration:none}.uid{font-size:12px;color:#8fa3bf;word-break:break-all;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{display:block;color:#c9d4e7;font-weight:600;margin-bottom:7px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #34445f;background:#0b1425;color:#fff;outline:none;margin-bottom:15px}input:focus{border-color:#60a5fa}button{padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.danger{background:#dc2626}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.msg{margin:15px 0;padding:12px;border-radius:10px;background:#123322;color:#bbf7d0;display:none}.error{background:#3b1720;color:#fecaca}.loading{text-align:center;color:#9fb0cc}</style>
</head>
<body>
<div class="box">
<div class="top"><div><a class="back" href="dashboard.html">← Dashboard</a><h1>⚙️ Shop Settings</h1><div id="uid" class="uid"></div></div><button id="logout" class="danger" type="button">Logout</button></div>
<div id="loading" class="loading">Checking login...</div>
<div id="content" style="display:none">
<form id="settingsForm">
<div class="grid"><div><label for="shop">Shop Name</label><input id="shop" required></div><div><label for="name">Owner Name</label><input id="name" required></div></div>
<div class="grid"><div><label for="phone">Phone</label><input id="phone" type="tel"></div><div><label for="email">Email</label><input id="email" type="email" readonly></div></div>
<label for="address">Address</label><input id="address">
<button type="submit">💾 Save Settings</button>
</form><div id="msg" class="msg"></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA",authDomain:"public-project-4d672.firebaseapp.com",databaseURL:"https://public-project-4d672-default-rtdb.firebaseio.com",projectId:"public-project-4d672",storageBucket:"public-project-4d672.firebasestorage.app",messagingSenderId:"265276656656",appId:"1:265276656656:web:40d1c9098c181c97b88e95",measurementId:"G-PY7LB9JY7F"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);
function showMsg(t,err=false){$('msg').textContent=t;$('msg').className='msg'+(err?' error':'');$('msg').style.display='block'}
auth.onAuthStateChanged(async user=>{
  $('loading').style.display='none';
  if(!user){location.replace('index.html');return;}
  $('content').style.display='block';
  $('uid').textContent='User UID: '+user.uid;
  $('email').value=user.email||'';
  try{const snap=await db.ref('users/'+user.uid+'/profile').once('value');const v=snap.val()||{};$('shop').value=v.shopName||'';$('name').value=v.name||'';$('phone').value=v.phone||'';$('address').value=v.address||'';}catch(e){showMsg('Could not load settings: '+e.message,true)}
});
$('settingsForm').addEventListener('submit',async e=>{e.preventDefault();const u=auth.currentUser;if(!u){showMsg('Please login again.',true);return;}try{await db.ref('users/'+u.uid+'/profile').update({shopName:$('shop').value.trim(),name:$('name').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),email:u.email||'',updatedAt:firebase.database.ServerValue.TIMESTAMP});showMsg('✅ Settings saved successfully.');}catch(e){showMsg('❌ Save failed: '+e.message,true)}});
$('logout').onclick=()=>auth.signOut().then(()=>location.replace('index.html'));
</script>
</body>
</html>
