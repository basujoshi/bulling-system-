<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing • Login</title><meta name="theme-color" content="#0b1220"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#07111f,#101b33);color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#111b2e;border:1px solid #263552;border-radius:22px;padding:30px;box-shadow:0 25px 80px #0007}h1{margin:0 0 8px}p{color:#9fb0cc}.brand{font-size:14px;color:#6ee7b7;margin-bottom:20px}label{display:block;margin:15px 0 7px;color:#c9d4e7}input{width:100%;padding:13px;border-radius:12px;border:1px solid #34445f;background:#0b1425;color:#fff}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.link{text-align:center;margin-top:18px}.link a{color:#60a5fa}.msg{margin-top:15px;padding:10px;border-radius:10px;display:none}.err{background:#3b1720;color:#fecaca}.ok{background:#123322;color:#bbf7d0}</style></head><body><main class="card"><div class="brand">BILLING • MULTI-USER</div><h1>Sign in</h1><p>Your shop data is separated by your Firebase user UID.</p><form id="login"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Login</button></form><div id="msg" class="msg"></div><div class="link">New shop? <a href="register.html">Create account</a></div></main><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script>const firebaseConfig={apiKey:"AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA",authDomain:"public-project-4d672.firebaseapp.com",databaseURL:"https://public-project-4d672-default-rtdb.firebaseio.com",projectId:"public-project-4d672",storageBucket:"public-project-4d672.firebasestorage.app",messagingSenderId:"265276656656",appId:"1:265276656656:web:40d1c9098c181c97b88e95",measurementId:"G-PY7LB9JY7F"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();auth.onAuthStateChanged(u=>{if(u) location.replace('dashboard.html')});const f=document.getElementById('login'),m=document.getElementById('msg'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');f.onsubmit=async e=>{e.preventDefault();m.style.display='none';try{await auth.signInWithEmailAndPassword(emailInput.value.trim().toLowerCase(),passwordInput.value);location.replace('dashboard.html')}catch(x){m.className='msg err';m.textContent=x.message;m.style.display='block'}};</script></body></html>
