<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing • Register Shop</title><meta name="theme-color" content="#0b1220"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#07111f,#101b33);color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(500px,100%);background:#111b2e;border:1px solid #263552;border-radius:22px;padding:30px;box-shadow:0 25px 80px #0007}h1{margin:0 0 8px}p{color:#9fb0cc}label{display:block;margin:14px 0 7px;color:#c9d4e7}input{width:100%;padding:13px;border-radius:12px;border:1px solid #34445f;background:#0b1425;color:#fff}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:12px;background:#10b981;color:#062018;font-weight:800;cursor:pointer}.msg{margin-top:15px;padding:10px;border-radius:10px}.err{background:#3b1720;color:#fecaca}.link{text-align:center;margin-top:18px}.link a{color:#60a5fa}</style></head><body><main class="card"><h1>Create your shop account</h1><p>One account = one isolated billing workspace.</p><form id="reg"><label>Shop name</label><input id="shop" required><label>Your name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password (minimum 6 characters)</label><input id="password" type="password" minlength="6" required><button>Create Account</button></form><div id="msg"></div><div class="link">Already registered? <a href="index.html">Login</a></div></main><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script>const firebaseConfig={apiKey:"AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA",authDomain:"public-project-4d672.firebaseapp.com",databaseURL:"https://public-project-4d672-default-rtdb.firebaseio.com",projectId:"public-project-4d672",storageBucket:"public-project-4d672.firebasestorage.app",messagingSenderId:"265276656656",appId:"1:265276656656:web:40d1c9098c181c97b88e95",measurementId:"G-PY7LB9JY7F"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();reg.onsubmit=async e=>{e.preventDefault();msg.className='';msg.textContent='Creating...';try{const c=await auth.createUserWithEmailAndPassword(email.value.trim(),password.value);await db.ref('users/'+c.user.uid+'/profile').set({shopName:shop.value.trim(),name:name.value.trim(),email:c.user.email,createdAt:firebase.database.ServerValue.TIMESTAMP});location.replace('dashboard.html')}catch(x){msg.className='msg err';msg.textContent=x.message}};</script></body></html>
