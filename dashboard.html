<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing Dashboard</title><style>body{margin:0;font-family:Arial;background:#08111f;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:25px 0}.card,a{background:#111d31;border:1px solid #263a5b;border-radius:16px;padding:18px;color:#fff;text-decoration:none}.card b{font-size:20px}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}button{background:#ef4444;color:#fff;border:0;border-radius:10px;padding:10px 15px}.small{color:#9fb0cc}</style></head><body><div class="wrap"><div class="top"><div><h1 id="shop">Billing</h1><div class="small" id="user"></div></div><button id="logout">Logout</button></div><div class="grid"><div class="card">Products<br><b id="products">—</b></div><div class="card">Bills<br><b id="bills">—</b></div><div class="card">Customers<br><b id="customers">—</b></div><div class="card">Returns<br><b id="returns">—</b></div></div><div class="actions"><a href="Billing3.html">🧾 New Billing</a><a href="billingstock.html">📦 Stock</a><a href="Billing3 Return.html">↩️ Return</a><a href="Billing3 summary.html">📊 Summary</a><a href="Billing3 reprint.html">🖨️ Reprint</a><a href="Billing3 costomer data.html">👥 Customers</a><a href="Billing3 Cash out.html">💰 Cash Out</a><a href="Billing3 editing.html">✏️ Edit Bill</a><a href="settings.html">⚙️ Shop Settings</a></div></div><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script>const c={apiKey:"AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA",authDomain:"public-project-4d672.firebaseapp.com",databaseURL:"https://public-project-4d672-default-rtdb.firebaseio.com",projectId:"public-project-4d672",storageBucket:"public-project-4d672.firebasestorage.app",messagingSenderId:"265276656656",appId:"1:265276656656:web:40d1c9098c181c97b88e95"};firebase.initializeApp(c);const a=firebase.auth();a.onAuthStateChanged(async u=>{if(!u)return location.replace('index.html');user.textContent=u.email+' • UID: '+u.uid;const r=firebase.database().ref('users/'+u.uid);const p=await r.child('profile').once('value');shop.textContent=(p.val()||{}).shopName||'Billing Dashboard';for(const k of ['products','bills','customers','returns']){const s=await r.child(k).once('value');document.getElementById(k).textContent=s.numChildren()}});logout.onclick=()=>a.signOut().then(()=>location.replace('index.html'));</script></body></html>
