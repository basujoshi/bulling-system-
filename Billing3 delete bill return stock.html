<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delete Bill Reverse Stock</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2;margin:0;padding:10px}
.box{max-width:1300px;margin:auto;background:#fff;padding:15px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
label{display:block;font-weight:bold;margin:5px 0}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
button{padding:10px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
.btn{background:#000;color:#fff}
.del{background:#c0392b;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #000;padding:8px;text-align:center;font-weight:bold}
th{background:#000;color:#fff}
.card{margin-top:15px;border:1px solid #000;padding:10px;border-radius:8px}
.small{font-size:12px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>

<script src="js/multiuser.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{ requireBillingAuth().catch(()=>{}); });</script>
</head>
<body>
<div class="box">
  <div class="card">
    <div class="grid">
      <div>
        <label>Search Bill No</label>
        <input id="searchBill" oninput="loadBills()">
      </div>
      <div>
        <label>Search Phone</label>
        <input id="searchPhone" oninput="loadBills()">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="small"><b>Delete bill will reverse stock:</b> items qty stock me wapas add ho jayegi.</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Bill No</th>
        <th>Date</th>
        <th>Customer</th>
        <th>Phone</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</div>

<script>
const db = scopedDatabase();

let billsCache = [];

function norm(s){
  return String(s||"").trim().toLowerCase();
}

function loadBills(){
  const qBill = document.getElementById("searchBill").value.trim().toLowerCase();
  const qPhone = document.getElementById("searchPhone").value.trim().toLowerCase();
  const body = document.getElementById("body");
  body.innerHTML = "";

  db.ref("bills").once("value").then(snap=>{
    billsCache = [];
    snap.forEach(child=>{
      const d = child.val() || {};
      const row = {
        key: child.key,
        billNo: d.billNo || child.key,
        date: d.date || "",
        customerName: d.customerName || "",
        customerPhone: d.customerPhone || "",
        total: d.total || 0,
        items: d.items || []
      };

      const hay = `${row.billNo} ${row.date} ${row.customerName} ${row.customerPhone}`.toLowerCase();
      if((!qBill || hay.includes(qBill)) && (!qPhone || hay.includes(qPhone))){
        billsCache.push(row);
      }
    });

    billsCache.forEach(r=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.billNo}</td>
        <td>${r.date}</td>
        <td>${r.customerName}</td>
        <td>${r.customerPhone}</td>
        <td>${parseFloat(r.total||0).toFixed(2)}</td>
        <td><button class="del" onclick="deleteBill('${r.billNo}')">Delete</button></td>
      `;
      body.appendChild(tr);
    });
  });
}

async function reverseStock(items){
  const updates = {};
  for(const item of items){
    const key = norm(`${item.name||""}|${item.brand||""}|${item.code||""}|${item.size||""}`);
    const snap = await db.ref("stocks").orderByChild("stockKey").equalTo(key).once("value");

    if(snap.exists()){
      snap.forEach(child=>{
        const currentQty = parseFloat(child.val().qty) || 0;
        updates[`stocks/${child.key}/qty`] = currentQty + (parseFloat(item.qty) || 0);
        updates[`stocks/${child.key}/updatedAt`] = new Date().toISOString();
      });
    }else{
      const ref = db.ref("stocks").push();
      await ref.set({
        stockKey: key,
        itemName: item.name || "",
        brandName: item.brand || "",
        itemCode: item.code || "",
        size: item.size || "",
        price: parseFloat(item.price) || 0,
        qty: parseFloat(item.qty) || 0,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
    }
  }
  if(Object.keys(updates).length) await db.ref().update(updates);
}

async function deleteBill(billNo){
  if(!confirm("Delete bill and reverse stock?")) return;

  const snap = await db.ref("bills").orderByChild("billNo").equalTo(billNo).once("value");
  if(!snap.exists()){
    alert("Bill not found");
    return;
  }

  const billEntries = [];
  snap.forEach(child=>{
    billEntries.push({key: child.key, data: child.val()});
  });

  for(const entry of billEntries){
    const items = entry.data.items || [];
    await reverseStock(items);
    await db.ref("bills/" + entry.key).remove();
    await db.ref("payments/" + billNo).remove();
  }

  alert("Bill deleted and stock reversed");
  loadBills();
}

loadBills();
</script>
</body>
</html>
