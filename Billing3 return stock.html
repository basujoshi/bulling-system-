<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Return Bill Auto Stock Update</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2;margin:0;padding:10px}
.box{max-width:1400px;margin:auto;background:#fff;padding:15px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label{display:block;font-weight:bold;margin:5px 0}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
button{padding:10px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
.add{background:#2980b9;color:#fff}
.save{background:green;color:#fff}
.del{background:#c0392b;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #000;padding:8px;text-align:center;font-weight:bold}
th{background:#000;color:#fff}
.card{margin-top:15px;border:1px solid #000;padding:10px;border-radius:8px}
.small{font-size:12px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
window.BILLING_FIREBASE_CONFIG = {
  apiKey: "AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA",
  authDomain: "public-project-4d672.firebaseapp.com",
  databaseURL: "https://public-project-4d672-default-rtdb.firebaseio.com",
  projectId: "public-project-4d672",
  storageBucket: "public-project-4d672.firebasestorage.app",
  messagingSenderId: "265276656656",
  appId: "1:265276656656:web:40d1c9098c181c97b88e95",
  measurementId: "G-PY7LB9JY7F"
};
</script>
<script src="js/multiuser.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{ requireBillingAuth().catch(()=>{}); });</script>
</head>
<body>
<div class="box">
  <div class="card">
    <div class="grid">
      <div><label>Return Bill No</label><input id="returnBillNo"></div>
      <div><label>Date</label><input id="date" type="date"></div>
      <div><label>Customer Name</label><input id="customerName"></div>
      <div><label>Phone</label><input id="customerPhone"></div>
    </div>
  </div>

  <div class="card">
    <button class="add" onclick="addRow()">Add Item</button>
    <button class="save" onclick="saveReturnBill()">Save Return Bill</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>SN</th>
        <th>Item Name</th>
        <th>Brand Name</th>
        <th>Item Code</th>
        <th>Size</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>Del</th>
      </tr>
    </thead>
    <tbody id="itemBody"></tbody>
  </table>

  <div class="card">
    <div class="small"><b>Total Qty:</b> <span id="totalQty">0</span></div>
    <div class="small"><b>Total Amount:</b> <span id="totalAmount">0.00</span></div>
  </div>
</div>

<script>
const db = scopedDatabase();
document.getElementById("date").value = new Date().toISOString().slice(0,10);

function addRow(data={}){
  const body = document.getElementById("itemBody");
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="sn">${body.rows.length+1}</td>
    <td><input class="itemName" value="${data.itemName||""}" oninput="calcRow(this)"></td>
    <td><input class="brandName" value="${data.brandName||""}" oninput="calcRow(this)"></td>
    <td><input class="itemCode" value="${data.itemCode||""}" oninput="calcRow(this)"></td>
    <td><input class="size" value="${data.size||""}" oninput="calcRow(this)"></td>
    <td><input class="price" type="number" min="0" value="${data.price||0}" oninput="calcRow(this)"></td>
    <td><input class="qty" type="number" min="1" value="${data.qty||1}" oninput="calcRow(this)"></td>
    <td class="amount">0.00</td>
    <td><button class="del" onclick="removeRow(this)">X</button></td>
  `;
  body.appendChild(tr);
  calcRow(tr.querySelector(".qty"));
}

function removeRow(btn){
  btn.closest("tr").remove();
  renumber();
  recalcTotal();
}

function renumber(){
  document.querySelectorAll("#itemBody tr").forEach((r,i)=>r.querySelector(".sn").innerText=i+1);
}

function calcRow(el){
  const tr = el.closest("tr");
  const p = parseFloat(tr.querySelector(".price").value)||0;
  const q = parseFloat(tr.querySelector(".qty").value)||0;
  tr.querySelector(".amount").innerText = (p*q).toFixed(2);
  recalcTotal();
}

function recalcTotal(){
  let q=0,a=0;
  document.querySelectorAll("#itemBody tr").forEach(tr=>{
    q += parseFloat(tr.querySelector(".qty").value)||0;
    a += parseFloat(tr.querySelector(".amount").innerText)||0;
  });
  document.getElementById("totalQty").innerText = q;
  document.getElementById("totalAmount").innerText = a.toFixed(2);
}

function norm(s){
  return String(s||"").trim().toLowerCase().replace(/s+/g," ");
}

async function addOrUpdateStock(item){
  const key = norm(`${item.itemName}|${item.brandName}|${item.itemCode}|${item.size}`);
  const snap = await db.ref("stocks").orderByChild("stockKey").equalTo(key).once("value");

  if(snap.exists()){
    const updates = {};
    snap.forEach(child=>{
      const cur = parseFloat(child.val().qty)||0;
      updates[`stocks/${child.key}/qty`] = cur + (parseFloat(item.qty)||0);
      updates[`stocks/${child.key}/price`] = item.price;
      updates[`stocks/${child.key}/itemName`] = item.itemName;
      updates[`stocks/${child.key}/brandName`] = item.brandName;
      updates[`stocks/${child.key}/itemCode`] = item.itemCode;
      updates[`stocks/${child.key}/size`] = item.size;
      updates[`stocks/${child.key}/updatedAt`] = new Date().toISOString();
    });
    await db.ref().update(updates);
  }else{
    const ref = db.ref("stocks").push();
    await ref.set({
      stockKey: key,
      itemName: item.itemName,
      brandName: item.brandName,
      itemCode: item.itemCode,
      size: item.size,
      price: item.price,
      qty: parseFloat(item.qty)||0,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  }
}

async function saveReturnBill(){
  const returnBillNo = document.getElementById("returnBillNo").value.trim();
  if(!returnBillNo){ alert("Return Bill No required"); return; }

  const items = [];
  document.querySelectorAll("#itemBody tr").forEach(tr=>{
    items.push({
      itemName: tr.querySelector(".itemName").value.trim(),
      brandName: tr.querySelector(".brandName").value.trim(),
      itemCode: tr.querySelector(".itemCode").value.trim(),
      size: tr.querySelector(".size").value.trim(),
      price: parseFloat(tr.querySelector(".price").value)||0,
      qty: parseFloat(tr.querySelector(".qty").value)||0,
      amount: parseFloat(tr.querySelector(".amount").innerText)||0
    });
  });

  const bill = {
    returnBillNo,
    date: document.getElementById("date").value,
    customerName: document.getElementById("customerName").value.trim(),
    customerPhone: document.getElementById("customerPhone").value.trim(),
    items,
    totalQty: parseFloat(document.getElementById("totalQty").innerText)||0,
    totalAmount: parseFloat(document.getElementById("totalAmount").innerText)||0,
    createdAt: new Date().toISOString()
  };

  await db.ref("returnBills/" + returnBillNo).set(bill);

  for(const item of items){
    await addOrUpdateStock(item);
  }

  alert("Return saved and stock updated");
}

addRow();
</script>
</body>
</html>
