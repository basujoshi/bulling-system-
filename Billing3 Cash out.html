<body>
<div class="box hidden-print">
  <div class="card">
    <div class="grid">
      <div><label>Date</label><input type="date" id="date"></div>
      <div><label>Voucher No</label><input id="voucherNo" placeholder="V-001"></div>
      <div><label>Opening Amount</label><input type="number" id="openingAmount" value="0" min="0" oninput="calcClosing()"></div>
      <div><label>Cash Out / Expenses</label><input type="number" id="cashOut" value="0" min="0" oninput="calcClosing()"></div>
      <div><label>Closing Amount</label><input type="number" id="closingAmount" readonly></div>
      <div><label>Search</label><input id="search" oninput="renderList()" placeholder="note / reference / amount"></div>
      <div style="display:flex;align-items:end"><button class="add" onclick="saveDay()">Save Day</button></div>
      <div style="display:flex;align-items:end"><button class="btn" onclick="loadData()">Refresh</button></div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>Day</label><input type="date" id="dayFilter" onchange="loadData()"></div>
      <div><label>Month</label><input type="month" id="monthFilter" onchange="loadData()"></div>
      <div><label>Year</label><input type="number" id="yearFilter" placeholder="2026" onchange="loadData()"></div>
      <div style="display:flex;align-items:end"><button class="print" onclick="window.print()">Print Page</button></div>
    </div>
  </div>

  <div class="card">
    <div class="total">Total Opening: <span id="sumOpening">0.00</span></div>
    <div class="total">Total Expenses: <span class="out" id="sumExpenses">0.00</span></div>
    <div class="total">Total Closing: <span id="sumClosing">0.00</span></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Voucher No</th>
        <th>Opening</th>
        <th>Expenses</th>
        <th>Closing</th>
        <th>Note</th>
        <th>Print</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</div>

<div class="voucher">
  <div class="vhead">
    <img src="https://i.ibb.co/wFzsH2HH/file-000000004ff8720a84a2883a63ef6b6e.png" alt="Shop Logo">

    <div><b>Voucher No:</b> <span id="pvoucher"></span></div>
    <div><b>Date:</b> <span id="pdate"></span></div>

    Total: <span id="ptotal"></span>

    <div>Receiver Sign</div>
    <div>Shop Sign</div>
  </div>
</div>

<script>
const db = scopedDatabase();

document.getElementById("date").value = new Date().toISOString().slice(0,10);
document.getElementById("dayFilter").value = new Date().toISOString().slice(0,10);
document.getElementById("monthFilter").value = new Date().toISOString().slice(0,7);
document.getElementById("yearFilter").value = new Date().getFullYear();

let rows = [];

function calcClosing(){
  const open = parseFloat(document.getElementById("openingAmount").value)||0;
  const out = parseFloat(document.getElementById("cashOut").value)||0;
  document.getElementById("closingAmount").value = (open - out).toFixed(2);
}

async function saveDay(){
  const date = document.getElementById("date").value;
  const voucherNo = document.getElementById("voucherNo").value.trim();
  if(!date || !voucherNo){ alert("Date and Voucher No required"); return; }

  const data = {
    date,
    voucherNo,
    openingAmount: parseFloat(document.getElementById("openingAmount").value)||0,
    cashOut: parseFloat(document.getElementById("cashOut").value)||0,
    closingAmount: parseFloat(document.getElementById("closingAmount").value)||0,
    note: document.getElementById("search").value.trim(),
    updatedAt: new Date().toISOString()
  };

  await db.ref("cashBook/" + date).set(data);
  alert("Saved");
  loadData();
}

function loadData(){
  db.ref("cashBook").once("value").then(snap=>{
    rows = [];
    snap.forEach(child=>{
      rows.push({ key: child.key, ...(child.val()||{}) });
    });
    renderList();
  });
}

function renderList(){
  const day = document.getElementById("dayFilter").value;
  const month = document.getElementById("monthFilter").value;
  const year = document.getElementById("yearFilter").value.trim();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const body = document.getElementById("body");
  body.innerHTML = "";

  let sOpen = 0, sExp = 0, sClose = 0;

  const filtered = rows.filter(x=>{
    const date = String(x.date||"");
    const hay = `${x.date||""} ${x.voucherNo||""} ${x.note||""}`.toLowerCase();
    return (!day || date === day) && (!month || date.slice(0,7) === month) && (!year || date.slice(0,4) === year) && (!q || hay.includes(q));
  }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));

  filtered.forEach(x=>{
    const open = parseFloat(x.openingAmount)||0;
    const exp = parseFloat(x.cashOut)||0;
    const close = parseFloat(x.closingAmount)||0;
    sOpen += open;
    sExp += exp;
    sClose = close;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${x.date||""}</td>
      <td>${x.voucherNo||""}</td>
      <td>${open.toFixed(2)}</td>
      <td class="out">${exp.toFixed(2)}</td>
      <td>${close.toFixed(2)}</td>
      <td>${x.note||""}</td>
      <td><button class="print" onclick='printVoucher(${JSON.stringify(x)})'>Print</button></td>
    `;
    body.appendChild(tr);
  });

  document.getElementById("sumOpening").innerText = sOpen.toFixed(2);
  document.getElementById("sumExpenses").innerText = sExp.toFixed(2);
  document.getElementById("sumClosing").innerText = sClose.toFixed(2);
}

function printVoucher(x){
  document.getElementById("pvoucher").innerText = x.voucherNo || "";
  document.getElementById("pdate").innerText = x.date || "";
  document.getElementById("pref").innerText = "Cash Book";
  document.getElementById("pnote").innerText = x.note || "";
  document.getElementById("pamount").innerText = (parseFloat(x.cashOut)||0).toFixed(2);
  document.getElementById("ptotal").innerText = (parseFloat(x.cashOut)||0).toFixed(2);
  window.print();
}

calcClosing();
loadData();
</script>
</body>
</html>
