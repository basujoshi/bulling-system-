<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Return Summary</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:black;
color:white;
padding:10px;
}

td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

.total{
margin-top:20px;
font-size:22px;
font-weight:bold;
}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

  apiKey: "AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA",
  authDomain: "public-project-4d672.firebaseapp.com",
  databaseURL: "https://public-project-4d672-default-rtdb.firebaseio.com",
  projectId: "public-project-4d672",

</head>
<body>

<h1>Return Stock Summary</h1>

<table>
<thead>
<tr>
<th>Return No</th>
<th>Date</th>
<th>Customer</th>
<th>Item</th>
<th>Code</th>
<th>Qty</th>
<th>Rate</th>
<th>Amount</th>
</tr>
</thead>

<tbody id="returnData"></tbody>

</table>

<div class="total">
Total Return Amount :
₹ <span id="grandTotal">0.00</span>
</div>

<script>

const db = scopedDatabase();

let grandTotal = 0;

db.ref("returnStock").once("value").then(snapshot=>{

let html = "";

snapshot.forEach(returnSnap=>{

const data = returnSnap.val();

(data.items || []).forEach(item=>{

grandTotal += Number(item.amount || 0);

html += `
<tr>
<td>${data.returnNo}</td>
<td>${data.date}</td>
<td>${data.customerName}</td>
<td>${item.item}</td>
<td>${item.code}</td>
<td>${item.returnQty}</td>
<td>${item.rate}</td>
<td>${item.amount}</td>
</tr>
`;

});

});

document.getElementById("returnData").innerHTML = html;

document.getElementById("grandTotal").innerText =
grandTotal.toFixed(2);

});

</script>

</body>
</html>
